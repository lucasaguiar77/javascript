<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imigração</title>
</head>
<body>
    <h1>Sistema de imigração</h1>

    Qual é a sua nacionalidade: <input type="text" name="txtimi" id="txtimi">
    <input type="button" value="Enviar" onclick="nascionalidade()">
    <div id="res">

    </div>

    <script>
        function nascionalidade(){
            var país = window.document.querySelector('input#txtimi')
            var res = window.document.querySelector('div#res')
            var nasc = (país.value)
            res.innerHTML = `<p>Vivendo em <strong>${nasc}</strong></p>`
            if (nasc == 'Brasil'){
                res.innerHTML += `<p>Você é Brasileiro!</p>`
            }else{
                res.innerHTML += `<p>Você é estrangeiro!</p>`
            }
        }
    </script>
</body>
</html>
